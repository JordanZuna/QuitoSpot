<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/main.css"/>
    <link rel="icon" type="image/jpeg" href="sources/logoVirgen.jpg">
    <title>QuitoSpot</title>
</head>
<body>
    <div class="navbar">
        <div id="logo">
            <img src="sources/logoVirgen.jpg"/>
            <header>QuitoSpot</header>
        </div>

        <!--barra de búsqueda-->
        <div class="barra_bsqd">
            <form action="#" method="get" class="search-form">
                <span class="search-icon">🔍</span>
                <input type="search" name="q" placeholder="Busca lugares, restaurantes..." class="search-input"/>
            </form>
        </div>
        <nav>
            <ul>
                <li>
                    <a href="prueba.com">Restaurantes</a>
                </li>
                <li>
                    <a id="btn_principal" href="prueba.com">Lugares</a>
                </li>
            </ul>
        </nav>
    </div>
    <div class="hero">
        <div id="Image-hero">
            <img src="sources/SF.jpg">
        </div>
        <div class="text-hero">
            <h1>Tu proximo lugar favorito esta en Quito</h1>
            <p>Explora nuevos lugares, descubre que ofrecen
                y encuentra opciones que se adapten a tus preferencias.
            </p>
        </div>
    </div>
</body>
</html>
